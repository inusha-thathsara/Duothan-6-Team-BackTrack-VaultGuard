services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DATABASE_URL=postgresql://vaultguard:vaultguard@auth-db:5432/auth_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=vaultguard-super-secret-jwt-key-2026-phase-2-mvp
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - BCRYPT_ROUNDS=12
      - NODE_ENV=production
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultguard
      POSTGRES_PASSWORD: vaultguard
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultguard -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  accounts-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultguard
      POSTGRES_PASSWORD: vaultguard
      POSTGRES_DB: accounts_db
    ports:
      - "5433:5432"
    volumes:
      - accounts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultguard -d accounts_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth_pgdata:
  accounts_pgdata:
